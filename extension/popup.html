<!DOCTYPE html>
<html dir="rtl"> <head>
    <meta charset="UTF-8">
    <style>
        body { width: 250px; font-family: Arial, sans-serif; text-align: center; padding: 15px; }
        img { width: 60px; margin-bottom: 10px; }
        .switch-container { margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 10px;}
        
        /* עיצוב כפתור ה-Toggle */
        .switch { position: relative; display: inline-block; width: 50px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 16px; width: 16px; left: 4px; bottom: 4px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #2196F3; }
        input:checked + .slider:before { transform: translateX(26px); }
    </style>
</head>
<body>
    <img src="icon.png" alt="ClarifyAi Logo">
    <h3>ClarifyAi</h3>
    <div class="switch-container">
        <span>פעיל:</span>
        <label class="switch">
            <input type="checkbox" id="toggleExtension">
            <span class="slider"></span>
        </label>
    </div>
    <p id="statusMsg" style="font-size: 12px; color: gray;">המערכת כבויה</p>

    <script src="popup.js"></script>
</body>
</html>
